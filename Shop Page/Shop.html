        <div class="dk-skeleton-line"></div>
        <div class="dk-skeleton-line dk-width-price"></div>
        <div class="dk-skeleton-button"></div>

        <div class="dk-skeleton-image"></div>
        <div class="dk-skeleton-line dk-width-small"></div>
        <div class="dk-skeleton-line"></div>

<style>

/* =========================================================
   DAKSHAARA SHOP
   Global visual language
   White / Black / Soft Grey
   ========================================================= */

@import url(
  'https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap'
);


/* =========================================================
   ROOT
   ========================================================= */

#dk-shop {

  --dk-black: #222222;
  --dk-text: #333333;
  --dk-grey: #666666;
  --dk-light-grey: #888888;
  --dk-border: #dddddd;
  --dk-soft-border: #eeeeee;
  --dk-white: #ffffff;
  --dk-discount-bg: #dceff0;

  width: 100%;
  max-width: 100%;

  margin: 0 auto;

  padding: 0 20px 60px;

  box-sizing: border-box;

  font-family: 'Poppins', sans-serif;

  color: var(--dk-black);

  background: #ffffff;

  -webkit-font-smoothing: antialiased;
}


/* =========================================================
   RESET ONLY INSIDE SHOP
   ========================================================= */

#dk-shop *,
#dk-shop *::before,
#dk-shop *::after {

  box-sizing: border-box;

}


#dk-shop button,
#dk-shop select {

  font-family: inherit;

}


#dk-shop button {

  cursor: pointer;

}


/* =========================================================
   SHOP HEADING
   ========================================================= */

.dk-shop-heading {

  width: 100%;

  padding-top: 10px;

  margin-bottom: 22px;

}


.dk-shop-breadcrumb {

  display: flex;

  align-items: center;

  gap: 10px;

  margin-bottom: 8px;

  font-size: 14px;

  line-height: 1.5;

  color: var(--dk-grey);

}


.dk-breadcrumb-arrow {

  font-size: 20px;

  line-height: 1;

  color: #777777;

}


.dk-shop-title-row {

  display: flex;

  align-items: baseline;

  gap: 8px;

}


.dk-shop-title-row h1 {

  margin: 0;

  padding: 0;

  font-size: 28px;

  line-height: 1.2;

  font-weight: 600;

  color: var(--dk-black);

}


#dk-product-count {

  font-size: 15px;

  color: var(--dk-grey);

  font-weight: 400;

}


/* =========================================================
   CATEGORY SECTION
   ========================================================= */

.dk-categories-section {

  width: 100%;

  margin-bottom: 28px;

}


.dk-category-scroll {

  display: flex;

  gap: 22px;

  width: 100%;

  overflow-x: auto;

  padding: 2px 0 8px;

  scrollbar-width: none;

}


.dk-category-scroll::-webkit-scrollbar {

  display: none;

}


.dk-category-card {

  flex: 0 0 auto;

  width: 120px;

  border: 0;

  background: transparent;

  padding: 0;

  text-align: center;

  color: var(--dk-black);

}


.dk-category-image-wrap {

  width: 120px;

  height: 120px;

  overflow: hidden;

  border-radius: 50%;

  background: #f4f4f4;

  margin-bottom: 9px;

}


.dk-category-image {

  width: 100%;

  height: 100%;

  object-fit: cover;

  display: block;

  transition: transform 0.3s ease;

}


.dk-category-card:hover .dk-category-image {

  transform: scale(1.04);

}


.dk-category-name {

  display: block;

  width: 100%;

  font-size: 14px;

  line-height: 1.35;

  font-weight: 500;

}


/* Active category */

.dk-category-card.dk-active .dk-category-image-wrap {

  outline: 2px solid var(--dk-black);

  outline-offset: 3px;

}


/* =========================================================
   DESKTOP TOOLBAR
   ========================================================= */

.dk-toolbar {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 20px;

  width: 100%;

  padding: 0;

  margin-bottom: 24px;

}


.dk-toolbar-left {

  display: flex;

  align-items: center;

  flex-wrap: wrap;

  gap: 10px;

}


.dk-filter-button,
.dk-dropdown-button {

  min-height: 44px;

  display: inline-flex;

  align-items: center;

  justify-content: center;

  gap: 9px;

  padding: 0 18px;

  border: 1px solid var(--dk-border);

  border-radius: 9px;

  background: #ffffff;

  color: var(--dk-black);

  font-size: 14px;

  font-weight: 500;

  transition:
    background 0.2s ease,
    border-color 0.2s ease;

}


.dk-filter-button:hover,
.dk-dropdown-button:hover {

  background: #fafafa;

  border-color: #bbbbbb;

}


.dk-filter-icon {

  width: 17px;

  display: inline-flex;

  flex-direction: column;

  gap: 3px;

}


.dk-filter-icon span {

  display: block;

  height: 1.5px;

  background: #555555;

}


.dk-filter-icon span:nth-child(1) {

  width: 17px;

}


.dk-filter-icon span:nth-child(2) {

  width: 12px;

  margin-left: 2px;

}


.dk-filter-icon span:nth-child(3) {

  width: 7px;

  margin-left: 5px;

}


/* =========================================================
   DROPDOWNS
   ========================================================= */

.dk-filter-dropdown {

  position: relative;

}


.dk-dropdown-button span {

  font-size: 17px;

  line-height: 1;

}


.dk-dropdown-menu {

  position: absolute;

  z-index: 100;

  top: calc(100% + 7px);

  left: 0;

  min-width: 190px;

  padding: 7px;

  border: 1px solid var(--dk-border);

  border-radius: 10px;

  background: #ffffff;

  box-shadow: 0 8px 30px rgba(0,0,0,0.08);

  display: none;

}


.dk-filter-dropdown.dk-open .dk-dropdown-menu {

  display: block;

}


.dk-dropdown-menu button {

  width: 100%;

  border: 0;

  background: #ffffff;

  text-align: left;

  padding: 10px 11px;

  border-radius: 7px;

  color: var(--dk-black);

  font-size: 13px;

}


.dk-dropdown-menu button:hover {

  background: #f5f5f5;

}


/* =========================================================
   SORT
   ========================================================= */

.dk-sort-wrapper {

  display: flex;

  align-items: center;

  gap: 7px;

  white-space: nowrap;

}


.dk-sort-label {

  font-size: 13px;

  color: var(--dk-grey);

}


#dk-sort-select {

  border: 0;

  outline: 0;

  background: #ffffff;

  color: var(--dk-black);

  font-size: 14px;

  font-weight: 500;

  cursor: pointer;

  padding: 8px 4px;

}


/* =========================================================
   MOBILE TOOLBAR
   ========================================================= */

.dk-mobile-toolbar {

  display: none;

}


/* =========================================================
   PRODUCT GRID
   ========================================================= */

.dk-product-grid {

  display: grid;

  grid-template-columns: repeat(4, minmax(0, 1fr));

  column-gap: 20px;

  row-gap: 42px;

  width: 100%;

}


/* =========================================================
   PRODUCT CARD
   ========================================================= */

.dk-product-card {

  min-width: 0;

  position: relative;

}


.dk-product-image-link {

  display: block;

  position: relative;

  width: 100%;

  aspect-ratio: 1 / 1;

  overflow: hidden;

  border-radius: 9px;

  background: #f5f5f5;

  text-decoration: none;

}


.dk-product-image {

  width: 100%;

  height: 100%;

  object-fit: cover;

  display: block;

  transition: transform 0.35s ease;

}


.dk-product-card:hover .dk-product-image {

  transform: scale(1.025);

}


/* =========================================================
   PRODUCT BADGES
   ========================================================= */

.dk-product-badges {

  position: absolute;

  top: 0;

  left: 0;

  z-index: 3;

  display: flex;

  flex-direction: column;

  align-items: flex-start;

  gap: 5px;

}


.dk-product-badge {

  display: inline-flex;

  align-items: center;

  min-height: 26px;

  padding: 3px 10px;

  border-radius: 0 0 6px 0;

  background: #333333;

  color: #ffffff;

  font-size: 11px;

  line-height: 1;

  font-weight: 600;

}


/* =========================================================
   PRODUCT INFORMATION
   ========================================================= */

.dk-product-info {

  padding: 11px 2px 0;

}


.dk-product-category {

  display: block;

  margin-bottom: 4px;

  color: #333333;

  font-size: 12px;

  line-height: 1.35;

  font-weight: 500;

}


.dk-product-title {

  margin: 0;

  min-height: 42px;

  color: var(--dk-black);

  font-size: 14px;

  line-height: 1.5;

  font-weight: 500;

}


.dk-product-title-link {

  color: inherit;

  text-decoration: none;

}


/* =========================================================
   PRICE
   ========================================================= */

.dk-product-price-row {

  display: flex;

  align-items: baseline;

  flex-wrap: wrap;

  gap: 7px;

  margin-top: 9px;

}


.dk-current-price {

  color: var(--dk-black);

  font-size: 18px;

  line-height: 1.3;

  font-weight: 600;

}


.dk-original-price {

  color: #777777;

  font-size: 12px;

  text-decoration: line-through;

}


.dk-discount {

  display: inline-flex;

  align-items: center;

  width: fit-content;

  margin-top: 6px;

  padding: 3px 9px;

  border-radius: 20px;

  background: var(--dk-discount-bg);

  color: #255b5d;

  font-size: 11px;

  line-height: 1.3;

  font-weight: 600;

}


/* =========================================================
   VARIATION / EXTRA INFO
   ========================================================= */

.dk-product-extra {

  min-height: 23px;

  margin-top: 7px;

  color: #555555;

  font-size: 12px;

  line-height: 1.4;

}


.dk-product-extra:empty {

  display: block;

}


/* =========================================================
   ADD TO CART
   ========================================================= */

.dk-add-to-cart {

  width: 100%;

  min-height: 43px;

  margin-top: 8px;

  padding: 8px 12px;

  border: 1px solid #555555;

  border-radius: 7px;

  background: #ffffff;

  color: #222222;

  font-size: 14px;

  line-height: 1.3;

  font-weight: 500;

  transition:
    background 0.2s ease,
    color 0.2s ease,
    border-color 0.2s ease;

}


.dk-add-to-cart:hover {

  background: #222222;

  color: #ffffff;

  border-color: #222222;

}


.dk-add-to-cart.dk-adding {

  opacity: 0.6;

  pointer-events: none;

}


.dk-add-to-cart.dk-added {

  background: #222222;

  color: #ffffff;

  border-color: #222222;

}


/* =========================================================
   LOADING SKELETON
   ========================================================= */

.dk-loading-state {

  width: 100%;

}


.dk-loading-grid {

  display: grid;

  grid-template-columns: repeat(4, minmax(0, 1fr));

  gap: 20px;

}


.dk-skeleton-card {

  width: 100%;

}


.dk-skeleton-image {

  width: 100%;

  aspect-ratio: 1 / 1;

  border-radius: 9px;

  background:
    linear-gradient(
      90deg,
      #f1f1f1 25%,
      #e8e8e8 50%,
      #f1f1f1 75%
    );

  background-size: 200% 100%;

  animation: dkSkeleton 1.4s infinite;

}


.dk-skeleton-line {

  height: 12px;

  width: 85%;

  margin-top: 12px;

  border-radius: 8px;

  background: #eeeeee;

}


.dk-skeleton-line.dk-width-small {

  width: 35%;

  margin-top: 14px;

}


.dk-skeleton-line.dk-width-price {

  width: 45%;

}


.dk-skeleton-button {

  width: 100%;

  height: 42px;

  margin-top: 12px;

  border-radius: 7px;

  background: #eeeeee;

}


@keyframes dkSkeleton {

  0% {

    background-position: 200% 0;

  }

  100% {

    background-position: -200% 0;

  }

}


.dk-loading-text {

  text-align: center;

  margin: 22px 0 0;

  color: #777777;

  font-size: 13px;

}


/* =========================================================
   ERROR
   ========================================================= */

.dk-error-state,
.dk-empty-state {

  text-align: center;

  padding: 55px 20px;

}


.dk-error-state h3,
.dk-empty-state h3 {

  margin: 0 0 7px;

  font-size: 18px;

  font-weight: 600;

}


.dk-error-state p,
.dk-empty-state p {

  margin: 0 0 18px;

  color: #666666;

  font-size: 13px;

}


#dk-retry,
#dk-clear-filter {

  min-height: 42px;

  padding: 8px 22px;

  border: 1px solid #555555;

  border-radius: 7px;

  background: #ffffff;

  color: #222222;

  font-size: 13px;

  font-weight: 500;

}


/* =========================================================
   LOAD MORE
   ========================================================= */

.dk-load-more-wrapper {

  display: flex;

  justify-content: center;

  margin-top: 45px;

}


#dk-load-more {

  min-width: 160px;

  min-height: 44px;

  padding: 9px 24px;

  border: 1px solid #555555;

  border-radius: 7px;

  background: #ffffff;

  color: #222222;

  font-size: 14px;

  font-weight: 500;

}


#dk-load-more:hover {

  background: #222222;

  color: #ffffff;

}


/* =========================================================
   CART MESSAGE
   ========================================================= */

.dk-cart-message {

  position: fixed;

  z-index: 99999;

  right: 22px;

  bottom: 22px;

  max-width: 320px;

  padding: 13px 17px;

  border: 1px solid #dddddd;

  border-radius: 8px;

  background: #ffffff;

  color: #222222;

  box-shadow: 0 8px 30px rgba(0,0,0,0.12);

  font-size: 13px;

  opacity: 0;

  pointer-events: none;

  transform: translateY(15px);

  transition:
    opacity 0.25s ease,
    transform 0.25s ease;

}


.dk-cart-message.dk-show {

  opacity: 1;

  transform: translateY(0);

}


/* =========================================================
   HIDDEN
   ========================================================= */

#dk-shop [hidden] {

  display: none !important;

}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 1100px) {

  #dk-shop {

    padding-left: 18px;

    padding-right: 18px;

  }


  .dk-product-grid {

    grid-template-columns: repeat(3, minmax(0, 1fr));

  }


  .dk-loading-grid {

    grid-template-columns: repeat(3, minmax(0, 1fr));

  }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 767px) {

  #dk-shop {

    padding: 0 20px 45px;

  }


  .dk-shop-heading {

    padding-top: 8px;

    margin-bottom: 18px;

  }


  .dk-shop-breadcrumb {

    font-size: 13px;

    gap: 8px;

  }


  .dk-shop-title-row h1 {

    font-size: 23px;

  }


  #dk-product-count {

    font-size: 13px;

  }


  /* CATEGORY */

  .dk-categories-section {

    margin-bottom: 18px;

  }


  .dk-category-scroll {

    gap: 20px;

    margin-right: -20px;

    padding-right: 20px;

  }


  .dk-category-card {

    width: 115px;

  }


  .dk-category-image-wrap {

    width: 115px;

    height: 115px;

  }


  .dk-category-name {

    font-size: 13px;

  }


  /* DESKTOP TOOLBAR OFF */

  .dk-toolbar {

    display: none;

  }

  /* MOBILE FILTER PANEL
     The desktop filter controls live inside .dk-toolbar, which is hidden
     on mobile. Show only the existing filter controls as a mobile panel
     when the mobile Filter button is tapped. */

  .dk-toolbar.dk-mobile-filter-visible {

    display: block;

    width: 100%;

    margin: 0 0 16px;

    padding: 12px;

    border: 1px solid #eeeeee;

    border-radius: 10px;

    background: #ffffff;

  }

  .dk-toolbar.dk-mobile-filter-visible .dk-toolbar-left {

    display: flex;

    flex-direction: column;

    align-items: stretch;

    gap: 8px;

    width: 100%;

  }

  .dk-toolbar.dk-mobile-filter-visible .dk-filter-button {

    display: none;

  }

  .dk-toolbar.dk-mobile-filter-visible .dk-filter-dropdown {

    width: 100%;

  }

  .dk-toolbar.dk-mobile-filter-visible .dk-dropdown-button {

    width: 100%;

    justify-content: space-between;

  }

  .dk-toolbar.dk-mobile-filter-visible .dk-dropdown-menu {

    position: static;

    width: 100%;

    min-width: 0;

    margin-top: 7px;

    box-shadow: none;

  }

  .dk-toolbar.dk-mobile-filter-visible .dk-sort-wrapper {

    display: none;

  }


  /* MOBILE TOOLBAR */

  .dk-mobile-toolbar {

    display: grid;

    grid-template-columns: 1fr 1px 1fr;

    align-items: center;

    width: calc(100% + 40px);

    margin-left: -20px;

    margin-bottom: 25px;

    border-top: 1px solid #eeeeee;

    border-bottom: 1px solid #eeeeee;

    background: #ffffff;

  }


  .dk-mobile-tool {

    min-height: 54px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 9px;

    border: 0;

    background: #ffffff;

    color: #222222;

    font-size: 14px;

    font-weight: 500;

  }


  .dk-grid-tool {

    display: none;

  }


  .dk-mobile-toolbar {

    grid-template-columns: 1fr 1fr;

  }


  .dk-sort-symbol {

    font-size: 21px;

    color: #777777;

  }


  /* PRODUCT GRID */

  .dk-product-grid {

    grid-template-columns: repeat(2, minmax(0, 1fr));

    column-gap: 12px;

    row-gap: 34px;

  }


  .dk-product-image-link {

    border-radius: 8px;

  }


  .dk-product-info {

    padding-top: 9px;

  }


  .dk-product-category {

    font-size: 11px;

  }


  .dk-product-title {

    min-height: 40px;

    font-size: 13px;

    line-height: 1.45;

  }


  .dk-product-price-row {

    gap: 5px;

    margin-top: 7px;

  }


  .dk-current-price {

    font-size: 16px;

  }


  .dk-original-price {

    font-size: 10px;

  }


  .dk-discount {

    margin-top: 5px;

    padding: 3px 7px;

    font-size: 10px;

  }


  .dk-product-extra {

    min-height: 20px;

    font-size: 10px;

  }


  .dk-add-to-cart {

    min-height: 42px;

    margin-top: 7px;

    font-size: 13px;

  }


  /* LOADING */

  .dk-loading-grid {

    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 12px;

  }


  .dk-skeleton-button {

    height: 42px;

  }


  .dk-cart-message {

    right: 15px;

    left: 15px;

    bottom: 15px;

    max-width: none;

    text-align: center;

  }

}


/* =========================================================
   SMALL MOBILE
   ========================================================= */

@media (max-width: 390px) {

  #dk-shop {

    padding-left: 16px;

    padding-right: 16px;

  }


  .dk-category-scroll {

    margin-right: -16px;

    padding-right: 16px;

  }


  .dk-mobile-toolbar {

    width: calc(100% + 32px);

    margin-left: -16px;

  }


  .dk-product-grid {

    column-gap: 10px;

  }


  .dk-current-price {

    font-size: 15px;

  }


  .dk-product-title {

    font-size: 12px;

  }

}

</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const CATEGORIES = [
        {id:41, label:"Home Decor", slug:"home-decor", image:"https://dakshaara.com/wp-content/uploads/2026/09/decor-1.png"},
        {id:40, label:"Kitchenware", slug:"wooden-kitchenware", image:"https://dakshaara.com/wp-content/uploads/2026/09/kitchen-png-1.png"},
        {id:42, label:"Pooja & Spiritual", slug:"puja-spiritual-decor", image:"https://dakshaara.com/wp-content/uploads/2026/09/Puja-cato.png"},
        {id:66, label:"Gifting", slug:"gifting", image:"https://dakshaara.com/wp-content/uploads/2026/09/gifting-1.png"}
    ];
    const API="/wp-json/wc/store/v1/products";
    const shop=document.getElementById("dk-shop");
    const categoryList=document.getElementById("dk-category-list");
    const grid=document.getElementById("dk-product-grid");
    const loading=document.getElementById("dk-loading");
    const errorBox=document.getElementById("dk-error");
    const empty=document.getElementById("dk-empty");
    const count=document.getElementById("dk-product-count");
    const loadMoreWrap=document.getElementById("dk-load-more-wrapper");
    const loadMore=document.getElementById("dk-load-more");
    const retry=document.getElementById("dk-retry");
    const clear=document.getElementById("dk-clear-filter");
    const sort=document.getElementById("dk-sort-select");
    const categoryFilter=document.getElementById("dk-category-filter");
    const priceFilter=document.getElementById("dk-price-filter");
    const toolbar=shop.querySelector(".dk-toolbar");
    const filterButton=document.getElementById("dk-filter-button");
    const mobileSort=document.getElementById("dk-mobile-sort");
    const mobileFilter=document.getElementById("dk-mobile-filter");
    const cartMessage=document.getElementById("dk-cart-message");

    if(!shop || !categoryList || !grid) return;

    let products=[];
    let page=1;
    let totalPages=1;
    let selectedCategory="all";
    let selectedPrice="all";
    let messageTimer=null;
    let requestNo=0;

    function esc(v){
        return String(v==null?"":v)
            .replace(/&/g,"&amp;").replace(/</g,"&lt;")
            .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");
    }
    function text(v){
        const d=document.createElement("div");
        d.innerHTML=String(v||"");
        return d.textContent||"";
    }
    function price(p,key){
        if(!p || !p.prices) return 0;
        const n=Number(p.prices[key]||0);
        const m=Number(p.prices.currency_minor_unit||0);
        return n/Math.pow(10,m);
    }
    function money(p,n){
        const x=p && p.prices ? p.prices : {};
        const m=Number(x.currency_minor_unit||0);
        const symbol=x.currency_symbol||"₹";
        return symbol+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:m,maximumFractionDigits:m});
    }
    function sale(p){ return price(p,"regular_price")>price(p,"price") && price(p,"price")>0; }
    function discount(p){
        const r=price(p,"regular_price"), c=price(p,"price");
        return r>c && r>0 ? Math.round((r-c)/r*100) : 0;
    }
    function msg(v){
        if(!cartMessage) return;
        cartMessage.textContent=v;
        cartMessage.classList.add("dk-show");
        if(messageTimer) clearTimeout(messageTimer);
        messageTimer=setTimeout(function(){cartMessage.classList.remove("dk-show");},2800);
    }
    function setState(name){
        if(loading) loading.hidden=name!=="loading";
        if(errorBox) errorBox.hidden=name!=="error";
        if(empty) empty.hidden=name!=="empty";
        if(name==="loading" || name==="error" || name==="empty"){
            if(name!=="loading" && loading) loading.hidden=true;
            if(name!=="error" && errorBox) errorBox.hidden=true;
            if(name!=="empty" && empty) empty.hidden=true;
        }
    }
    function updateCount(n){
        if(count) count.textContent=Number(n||0)+(Number(n||0)===1?" Product":" Products");
    }
    function closeDropdowns(){
        shop.querySelectorAll(".dk-filter-dropdown").forEach(function(x){x.classList.remove("dk-open");});
    }

    function closeMobileFilterPanel(){
        if(toolbar) toolbar.classList.remove("dk-mobile-filter-visible");
    }

    function openMobileFilterPanel(){
        if(toolbar) toolbar.classList.add("dk-mobile-filter-visible");
    }

    function buildCategories(){
        categoryList.innerHTML="";
        const frag=document.createDocumentFragment();
        const all=document.createElement("button");
        all.type="button";
        all.className="dk-category-card dk-active";
        all.setAttribute("data-category-id","all");
        all.innerHTML='<span class="dk-category-image-wrap"><img class="dk-category-image" src="https://dakshaara.com/wp-content/uploads/2026/09/All-products-logo.png" alt="All Products" loading="lazy"></span><span class="dk-category-name">All Products</span>';
        frag.appendChild(all);
        CATEGORIES.forEach(function(c){
            const b=document.createElement("button");
            b.type="button";
            b.className="dk-category-card";
            b.setAttribute("data-category-id",String(c.id));
            b.innerHTML='<span class="dk-category-image-wrap"><img class="dk-category-image" src="'+esc(c.image)+'" alt="'+esc(c.label)+'" loading="lazy"></span><span class="dk-category-name">'+esc(c.label)+'</span>';
            frag.appendChild(b);
        });
        categoryList.appendChild(frag);
    }
    function activeCategory(id){
        selectedCategory=String(id);
        categoryList.querySelectorAll(".dk-category-card").forEach(function(b){
            b.classList.toggle("dk-active",String(b.getAttribute("data-category-id"))===String(id));
        });
    }
    function buildCategoryFilter(){
        if(!categoryFilter) return;
        const menu=categoryFilter.querySelector(".dk-dropdown-menu");
        if(!menu) return;
        menu.innerHTML='<button type="button" data-category="all">All Products</button>';
        CATEGORIES.forEach(function(c){
            menu.insertAdjacentHTML("beforeend",'<button type="button" data-category="'+c.id+'">'+esc(c.label)+"</button>");
        });
    }

    async function getProducts(categoryId,p){
        const u=new URL(API,window.location.origin);
        u.searchParams.set("per_page","24");
        u.searchParams.set("page",String(p));
        if(String(categoryId)!=="all") u.searchParams.set("category",String(categoryId));
        const r=await fetch(u.toString(),{method:"GET",credentials:"same-origin",cache:"no-store"});
        if(!r.ok) throw new Error("Product API failed: "+r.status);
        const data=await r.json();
        if(!Array.isArray(data)) throw new Error("Invalid product API response");
        return {data:data,pages:Number(r.headers.get("X-WP-TotalPages")||1)};
    }

    function matchesPrice(p){
        const n=price(p,"price");
        if(selectedPrice==="0-1000") return n<1000;
        if(selectedPrice==="1000-2500") return n>=1000 && n<=2500;
        if(selectedPrice==="2500-5000") return n>2500 && n<=5000;
        if(selectedPrice==="5000+") return n>5000;
        return true;
    }
    function sorted(list){
        const a=list.slice(), s=sort?sort.value:"curated";
        if(s==="price-low") a.sort(function(x,y){return price(x,"price")-price(y,"price");});
        if(s==="price-high") a.sort(function(x,y){return price(y,"price")-price(x,"price");});
        if(s==="newest") a.sort(function(x,y){return new Date(y.date_created||0)-new Date(x.date_created||0);});
        return a;
    }
    function card(p){
        const title=text(p.name||"Product"), current=price(p,"price"), regular=price(p,"regular_price");
        const image=p.images && p.images.length && p.images[0] ? p.images[0].src : "";
        const cats=p.categories && p.categories.length ? text(p.categories[0].name) : "";
        const saleNow=sale(p), off=discount(p);
        return '<article class="dk-product-card" data-product-id="'+Number(p.id||0)+'" data-product-url="'+esc(p.permalink||"#")+'">'+
            '<div class="dk-product-image-link"><div class="dk-product-badges">'+(saleNow?'<span class="dk-product-badge">Sale</span>':"")+'</div>'+
            (image?'<img class="dk-product-image" src="'+esc(image)+'" alt="'+esc(title)+'" loading="lazy">':'<span class="dk-product-image" style="display:flex;align-items:center;justify-content:center;font-size:12px;color:#888;">No image</span>')+
            '</div><div class="dk-product-info">'+
            (cats?'<span class="dk-product-category">'+esc(cats)+"</span>":"")+
            '<h2 class="dk-product-title"><a class="dk-product-title-link" href="'+esc(p.permalink||"#")+'">'+esc(title)+"</a></h2>"+
            '<div class="dk-product-price-row"><span class="dk-current-price">'+money(p,current)+"</span>"+
            (saleNow?'<span class="dk-original-price">'+money(p,regular)+"</span>":"")+
            '</div>'+(off?'<span class="dk-discount">'+off+"% OFF</span>":"")+
            '<div class="dk-product-extra"></div><button type="button" class="dk-add-to-cart" data-product-id="'+Number(p.id||0)+'">Add to Cart</button>'+
            "</div></article>";
    }
    function render(){
        let list=products.filter(matchesPrice);
        list=sorted(list);
        grid.innerHTML="";
        if(!list.length){
            setState("empty");
            updateCount(0);
            if(loadMoreWrap) loadMoreWrap.hidden=true;
            return;
        }
        setState("ready");
        list.forEach(function(p){grid.insertAdjacentHTML("beforeend",card(p));});
        updateCount(list.length);
        if(loadMoreWrap) loadMoreWrap.hidden=page>=totalPages;
    }
    async function load(categoryId,reset){
        const token=++requestNo;
        selectedCategory=String(categoryId==null?selectedCategory:categoryId);
        if(reset!==false){
            page=1; products=[]; grid.innerHTML=""; setState("loading");
            if(loadMoreWrap) loadMoreWrap.hidden=true;
        }
        try{
            const result=await getProducts(selectedCategory,page);
            if(token!==requestNo) return;
            totalPages=result.pages;
            products=page===1?result.data:products.concat(result.data);
            render();
            if(!products.length) setState("empty");
        }catch(e){
            if(token!==requestNo) return;
            console.error("Dakshaara product loading error:",e);
            setState("error");
            if(loadMoreWrap) loadMoreWrap.hidden=true;
        }
    }
    window.dkLoadProductsByCategory=function(id){
        activeCategory(id);
        selectedPrice="all";
        closeDropdowns();
        load(id,true);
    };

    categoryList.addEventListener("click",function(e){
        const b=e.target.closest(".dk-category-card");
        if(!b) return;
        window.dkLoadProductsByCategory(b.getAttribute("data-category-id"));
    });

    shop.querySelectorAll(".dk-dropdown-button").forEach(function(b){
        b.addEventListener("click",function(e){
            e.stopPropagation();
            const d=b.closest(".dk-filter-dropdown");
            if(!d) return;
            const open=d.classList.contains("dk-open");
            closeDropdowns();
            if(!open) d.classList.add("dk-open");
        });
    });
    document.addEventListener("click",closeDropdowns);

    if(categoryFilter){
        categoryFilter.addEventListener("click",function(e){
            const b=e.target.closest("[data-category]");
            if(!b) return;
            const id=b.getAttribute("data-category");
            activeCategory(id);
            selectedPrice="all";
            closeDropdowns();
            closeMobileFilterPanel();
            load(id,true);
        });
    }
    if(priceFilter){
        priceFilter.addEventListener("click",function(e){
            const b=e.target.closest("[data-price]");
            if(!b) return;
            selectedPrice=b.getAttribute("data-price")||"all";
            closeDropdowns();
            closeMobileFilterPanel();
            render();
        });
    }
    if(filterButton){
        filterButton.addEventListener("click",function(){
            closeMobileFilterPanel();
            closeDropdowns();
            if(categoryFilter) categoryFilter.classList.add("dk-open");
        });
    }
    if(sort) sort.addEventListener("change",render);
    if(mobileSort && sort){
        mobileSort.addEventListener("click",function(){
            const opts=Array.from(sort.options), i=opts.findIndex(function(o){return o.value===sort.value;});
            sort.value=opts[(i+1)%opts.length].value;
            render();
        });
    }
    if(mobileFilter){
        mobileFilter.addEventListener("click",function(e){
            e.preventDefault();
            e.stopPropagation();

            const isOpen=toolbar && toolbar.classList.contains("dk-mobile-filter-visible");

            closeDropdowns();

            if(isOpen){
                closeMobileFilterPanel();
                return;
            }

            openMobileFilterPanel();

            if(categoryFilter) categoryFilter.classList.add("dk-open");
        });
    }
    if(loadMore){
        loadMore.addEventListener("click",async function(){
            if(page>=totalPages) return;
            loadMore.disabled=true;
            loadMore.textContent="Loading...";
            page++;
            try{
                const result=await getProducts(selectedCategory,page);
                totalPages=result.pages;
                products=products.concat(result.data);
                render();
            }catch(e){
                page--;
                console.error("Dakshaara load more error:",e);
                msg("Unable to load more products.");
            }
            loadMore.disabled=false;
            loadMore.textContent="Load More";
            if(loadMoreWrap) loadMoreWrap.hidden=page>=totalPages;
        });
    }
    if(retry) retry.addEventListener("click",function(){load(selectedCategory,true);});
    if(clear) clear.addEventListener("click",function(){
        selectedPrice="all";
        if(sort) sort.value="curated";
        activeCategory("all");
        closeMobileFilterPanel();
        load("all",true);
    });

    async function addToCart(id,button){
        button.disabled=true;
        button.classList.add("dk-adding");
        const old=button.textContent;
        button.textContent="Adding...";
        try{
            const fd=new FormData();
            fd.append("product_id",String(id));
            fd.append("quantity","1");
            let url="/?wc-ajax=add_to_cart";
            if(window.wc_add_to_cart_params && window.wc_add_to_cart_params.wc_ajax_url){
                url=window.wc_add_to_cart_params.wc_ajax_url.replace("%%endpoint%%","add_to_cart");
            }
            const r=await fetch(url,{method:"POST",credentials:"same-origin",body:fd});
            const data=await r.json();
            if(data && data.error && data.product_url) throw new Error("Add to cart failed");
            if(data && data.fragments){
                Object.keys(data.fragments).forEach(function(selector){
                    document.querySelectorAll(selector).forEach(function(el){
                        const temp=document.createElement("div");
                        temp.innerHTML=data.fragments[selector];
                        if(temp.firstElementChild) el.replaceWith(temp.firstElementChild);
                    });
                });
            }
            if(window.jQuery){
                window.jQuery(document.body).trigger("added_to_cart",[data.fragments||{},data.cart_hash||"",button]);
            }
            document.body.dispatchEvent(new CustomEvent("added_to_cart",{detail:data}));
            button.classList.remove("dk-adding");
            button.classList.add("dk-added");
            button.textContent="Added to Cart";
            msg("Product added to cart.");
            setTimeout(function(){
                button.classList.remove("dk-added");
                button.disabled=false;
                button.textContent=old;
            },1800);
        }catch(e){
            console.error("Dakshaara Add to Cart error:",e);
            button.classList.remove("dk-adding");
            button.disabled=false;
            button.textContent=old;
            msg("Unable to add product to cart.");
        }
    }
    grid.addEventListener("click",function(e){
        const addButton=e.target.closest(".dk-add-to-cart");
        if(addButton){
            e.preventDefault();
            e.stopPropagation();
            addToCart(addButton.getAttribute("data-product-id"),addButton);
            return;
        }

        const productLink=e.target.closest("a");
        if(productLink) return;

        const cardElement=e.target.closest(".dk-product-card");
        if(!cardElement) return;

        const productUrl=cardElement.getAttribute("data-product-url");
        if(productUrl && productUrl!=="#"){
            window.location.href=productUrl;
        }
    });

    buildCategories();
    buildCategoryFilter();
    activeCategory("all");
    load("all",true);
});
</script>
