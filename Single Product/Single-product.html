<style>

/* =====================================================
   FONT
===================================================== */

@import url(
  'https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap'
);


/* =====================================================

===================================================== */

#dk-product {

  --sand: #E7D2A6;

  --brown: #361E12;

  --navy: #12304B;

  --text: #27211D;

  --border: #E5DED7;

  --light: #F8F6F2;

  --green: #28754A;

  width: 100%;

  background: #FFFFFF;

  font-family:
    "Poppins",
    Arial,
    sans-serif;

  -webkit-font-smoothing:
    antialiased;

}


/* =====================================================

===================================================== */

}

===================================================== */

}

}

}

}

    100%;

}

}

===================================================== */

}

#dk-product .dk-shipping-text span {

*/

#dk-product .dk-quantity input {

    0 !important;

    0 !important;

===================================================== */

#dk-product .dk-add,
#dk-product #dk-mobile-add {

  position:
    relative;

  z-index:
    1;

  overflow:
    hidden;

  height:
    50px;

  width:
    100%;

    none;

  border-radius:
    5px;

  background:
    var(--brown);

    "Poppins",
    Arial,
    sans-serif;

  font-size:
    13px;

  font-weight:
    600;

  cursor:
    pointer;

}

#dk-product .dk-add span,
#dk-product #dk-mobile-add span {

  position:
    relative;

  z-index:
    3;

}

#dk-product .dk-add::after,
#dk-product #dk-mobile-add::after {

  content:
    "";

  position:
    absolute;

  z-index:

  right:

  top:
    0;

  bottom:
    0;

    #FFFFFF;

  transform:
    skewX(-45deg)

  transition:
    transform .5s ease;

    var(--brown);

<script>

document.addEventListener(
  "DOMContentLoaded",
  function () {


    /* =================================================
       GET PRODUCT ID
    ================================================= */

    var productId = "";


    var params =
      new URLSearchParams(
        window.location.search
      );


    productId =
      params.get(
        "product_id"
      );


    /*
      If product_id is not in URL,
      try WooCommerce post ID.
    */

    if (!productId) {

      var bodyClass =
        document.body.className;


      var match =
        bodyClass.match(
          /postid-([0-9]+)/
        );


      if (match) {

        productId =
          match[1];

      }

    }


    /*
      DEMO FALLBACK

      Wooden Temple Chariot
      Product ID = 471
    */

    if (!productId) {

      productId =
        "471";

    }


    /* =================================================
       API
    ================================================= */

    var apiUrl =
      "/wp-json/wc/store/v1/products/" +
      productId;


    console.log(
      "Dakshaara Product API:",
      apiUrl
    );


    fetch(apiUrl)

      .then(
        function (response) {

          if (!response.ok) {

            throw new Error(
              "API Error " +
              response.status
            );

          }

          return response.json();

        }
      )


      .then(
        function (product) {

          console.log(
            "Product Loaded:",
            product
          );


          renderProduct(
            product
          );

        }
      )


      .catch(
        function (error) {

          console.error(
            "Product loading error:",
            error
          );


          /*
            No infinite spinner.
            Show a simple message.
          */

          var main =
            document.getElementById(
              "dk-product-main"
            );


          if (main) {

            main.innerHTML =

              '<div style="' +
              'width:100%;' +
              'padding:60px 20px;' +
              'text-align:center;' +
              'color:#756C65;' +
              'font-size:13px;' +
              '">' +

              'Product could not be loaded.' +

              '</div>';

          }

        }
      );


    /* =================================================
       RENDER
    ================================================= */

    function renderProduct(
      product
    ) {


      /* ===============================================
         IMAGES
      =============================================== */

      var mainImage =
        document.getElementById(
          "dk-image"
        );


      var thumbs =
        document.getElementById(
          "dk-thumbs"
        );


      var images =
        product.images || [];


      if (
        images.length > 0
      ) {

        mainImage.src =
          images[0].src;


        mainImage.alt =
          product.name || "Product";


        images.forEach(
          function (
            image,
            index
          ) {


            var thumb =
              document.createElement(
                "button"
              );


            thumb.type =
              "button";


            thumb.className =
              "dk-thumb";


            if (
              index === 0
            ) {

              thumb.classList.add(
                "active"
              );

            }


            var imageElement =
              document.createElement(
                "img"
              );


            imageElement.src =
              image.thumbnail ||
              image.src;


            imageElement.alt =
              image.alt ||
              product.name ||
              "Product";


            thumb.appendChild(
              imageElement
            );


            thumb.addEventListener(
              "click",
              function () {


                mainImage.src =
                  image.src;


                var allThumbs =
                  document.querySelectorAll(
                    "#dk-product .dk-thumb"
                  );


                allThumbs.forEach(
                  function (
                    item
                  ) {

                    item.classList.remove(
                      "active"
                    );

                  }
                );


                thumb.classList.add(
                  "active"
                );

              }
            );


            thumbs.appendChild(
              thumb
            );

          }
        );

      }


      /* ===============================================
         CATEGORY
      =============================================== */

      var category =
        document.getElementById(
          "dk-category"
        );


      if (
        product.categories
      ) {

        if (
          product.categories.length > 0
        ) {

          category.textContent =
            product.categories[0].name;

        }

      }


      /* ===============================================
         TITLE
      =============================================== */

      document.getElementById(
        "dk-title"
      ).textContent =
        product.name ||
        "Product";


      /* ===============================================
         RATING
      =============================================== */

      var rating =
        Number(
          product.average_rating ||
          0
        );


      var reviewCount =
        Number(
          product.review_count ||
          0
        );


      document.getElementById(
        "dk-stars"
      ).textContent =
        getStars(rating);


      document.getElementById(
        "dk-rating-text"
      ).textContent =

        rating.toFixed(1) +
        " Rating · " +
        reviewCount +
        " Reviews";


      /* ===============================================
         PRICE
      =============================================== */

      renderPrice(
        product
      );


      /* ===============================================
         SHORT DESCRIPTION
      =============================================== */

      var shortDescription =
        document.getElementById(
          "dk-short-description"
        );


      if (
        product.short_description
      ) {

        shortDescription.innerHTML =
          product.short_description;

      }


      /* ===============================================
         STOCK
      =============================================== */

      var stock =
        document.getElementById(
          "dk-stock"
        );


      if (
        product.is_in_stock
      ) {

        stock.innerHTML =

          '<span class="dk-stock-dot"></span>' +
          '<span>In Stock</span>';

      }
      else {

        stock.innerHTML =
          '<span>Out of Stock</span>';

      }


      /* ===============================================
         DETAILS
      =============================================== */

      createProductDetails(
        product
      );


      /* ===============================================
         DESCRIPTION
      =============================================== */

      createDescription(
        product
      );


      /* ===============================================
         ACCORDIONS
      =============================================== */

      setupAccordions();


      /* ===============================================
         CART
      =============================================== */

      setupCart(
        product
      );

    }


    /* =================================================
       PRICE
    ================================================= */

    function renderPrice(
      product
    ) {


      var priceElement =
        document.getElementById(
          "dk-price"
        );


      var oldPriceElement =
        document.getElementById(
          "dk-old-price"
        );


      var discountElement =
        document.getElementById(
          "dk-discount"
        );


      if (
        !product.prices
      ) {

        return;

      }


      var minorUnit =
        Number(
          product.prices.currency_minor_unit ||
          2
        );


      var symbol =
        product.prices.currency_symbol ||
        "₹";


      var currentRaw =
        Number(
          product.prices.price ||
          0
        );


      var regularRaw =
        Number(
          product.prices.regular_price ||
          0
        );


      var current =
        currentRaw /
        Math.pow(
          10,
          minorUnit
        );


      var regular =
        regularRaw /
        Math.pow(
          10,
          minorUnit
        );


      priceElement.textContent =
        symbol +
        current.toLocaleString(
          "en-IN",
          {
            minimumFractionDigits:
              2,

            maximumFractionDigits:
              2
          }
        );


      if (
        regular > current
      ) {


        oldPriceElement.textContent =
          symbol +
          regular.toLocaleString(
            "en-IN",
            {
              minimumFractionDigits:
                2,

              maximumFractionDigits:
                2
            }
          );


        var discount =
          Math.round(
            (
              (
                regular -
                current
              ) /
              regular
            ) *
            100
          );


        discountElement.textContent =
          discount +
          "% OFF";

      }

    }


    /* =================================================
       STARS
    ================================================= */

    function getStars(
      rating
    ) {


      var result =
        "";


      var rounded =
        Math.round(
          rating
        );


      for (
        var i = 1;
        i <= 5;
        i++
      ) {

        if (
          i <= rounded
        ) {

          result +=
            "★";

        }
        else {

          result +=
            "☆";

        }

      }


      return result;

    }


    /* =================================================
       PRODUCT DETAILS
    ================================================= */

    function createProductDetails(
      product
    ) {


      var grid =
        document.getElementById(
          "dk-details-grid"
        );


      grid.innerHTML =
        "";


      /*
        API ATTRIBUTES
      */

      if (
        product.attributes
      ) {


        product.attributes.forEach(
          function (
            attribute
          ) {


            var label =
              attribute.name ||
              attribute.label ||
              "";


            var value =
              "";


            if (
              attribute.terms
            ) {


              var values =
                [];


              attribute.terms.forEach(
                function (
                  term
                ) {


                  if (
                    term.name
                  ) {

                    values.push(
                      term.name
                    );

                  }

                }
              );


              value =
                values.join(
                  ", "
                );

            }


            if (!value) {

              value =
                attribute.value ||
                "";

            }


            if (label) {
              if (value) {

                addDetail(
                  label,
                  value
                );

              }
            }

          }
        );

      }


      /*
        PRODUCT TYPE
      */

      if (
        product.type
      ) {

        addDetail(
          "Product Type",
          formatText(
            product.type
          )
        );

      }


      /*
        SKU
      */

      if (
        product.sku
      ) {

        addDetail(
          "SKU",
          product.sku
        );

      }


      /*
        WEIGHT
      */

      if (
        product.weight
      ) {

        addDetail(
          "Weight",
          product.weight
        );

      }


      /*
        DIMENSIONS
      */

      if (
        product.dimensions
      ) {


        var dimensionParts =
          [];


        if (
          product.dimensions.length
        ) {

          dimensionParts.push(
            product.dimensions.length
          );

        }


        if (
          product.dimensions.width
        ) {

          dimensionParts.push(
            product.dimensions.width
          );

        }


        if (
          product.dimensions.height
        ) {

          dimensionParts.push(
            product.dimensions.height
          );

        }


        if (
          dimensionParts.length
        ) {

          addDetail(
            "Dimensions",
            dimensionParts.join(
              " × "
            )
          );

        }

      }


      /*
        CATEGORY
      */

      if (
        product.categories
      ) {


        if (
          product.categories.length
        ) {


          var categoryNames =
            [];


          product.categories.forEach(
            function (
              item
            ) {

              categoryNames.push(
                item.name
              );

            }
          );


          addDetail(
            "Category",
            categoryNames.join(
              ", "
            )
          );

        }

      }


      /*
        STRUCTURED DESCRIPTION
      */

      var plainDescription =
        getPlainText(
          product.description
        );


      var extracted =
        extractDetails(
          plainDescription
        );


      extracted.forEach(
        function (
          item
        ) {

          addDetail(
            item.label,
            item.value
          );

        }
      );


      /*
        FALLBACK
      */

      if (
        !grid.innerHTML
      ) {

        grid.innerHTML =

          '<div class="dk-detail">' +

          '<span class="dk-detail-label">' +
          'Product Information' +
          '</span>' +

          '<span class="dk-detail-value">' +
          'Details will be updated soon.' +
          '</span>' +

          '</div>';

      }


      function addDetail(
        label,
        value
      ) {


        if (
          !value
        ) {

          return;

        }


        var existing =
          grid.querySelectorAll(
            ".dk-detail-label"
          );


        var alreadyExists =
          false;


        existing.forEach(
          function (
            item
          ) {


            if (
              item.textContent
                .trim()
                .toLowerCase()
                ===
              label
                .trim()
                .toLowerCase()
            ) {

              alreadyExists =
                true;

            }

          }
        );


        if (
          alreadyExists
        ) {

          return;

        }


        var detail =
          document.createElement(
            "div"
          );


        detail.className =
          "dk-detail";


        detail.innerHTML =

          '<span class="dk-detail-label">' +

          escapeHtml(
            label
          ) +

          '</span>' +

          '<span class="dk-detail-value">' +

          escapeHtml(
            value
          ) +

          '</span>';


        grid.appendChild(
          detail
        );

      }

    }


    /* =================================================
       DESCRIPTION
    ================================================= */

    function createDescription(
      product
    ) {


      var description =
        product.description ||
        "";


      document.getElementById(
        "dk-about"
      ).innerHTML =
        description;


      /*
        Highlights
      */

      var highlightContent =
        findHeadingSection(
          description,
          [
            "product highlights",
            "highlights",
            "key features"
          ]
        );


      if (
        highlightContent
      ) {

        document.getElementById(
          "dk-highlights"
        ).innerHTML =

      }
      else {

        hideSection(

        );

      }


      /*

      */

      var careContent =
        findHeadingSection(

          ]
        );


      if (

      ) {

        );

      }


      /*

      */

      );

      */

      var disclaimerContent =

          ]
        );

      ) {

      }

    }


    /* =================================================
       FIND HEADING SECTION
    ================================================= */

    function findHeadingSection(
      html,
      names
    ) {


      var temp =
        document.createElement(
          "div"
        );


      temp.innerHTML =
        html;


      var headings =
        temp.querySelectorAll(
          "h2,h3,h4"
        );


      for (
        var i = 0;
        i < headings.length;
        i++
      ) {


        var heading =
          headings[i];


        var headingText =
          heading.textContent
            .trim()
            .toLowerCase();


        var found =
          false;


        names.forEach(
          function (
            name
          ) {

            if (
              headingText ===
              name
            ) {

              found =
                true;

            }

          }
        );


        if (
          found
        ) {


          var htmlResult =
            "";


          var next =
            heading.nextElementSibling;


          while (
            next
          ) {


            var tag =
              next.tagName
                .toLowerCase();


            if (
              tag === "h2" ||
              tag === "h3" ||
              tag === "h4"
            ) {

              break;

            }


            htmlResult +=
              next.outerHTML;


            next =
              next.nextElementSibling;

          }


          return htmlResult;

        }

      }


      return "";

    }


    /* =================================================
       FAQ

        );


      faq.innerHTML =

      var temp =
        document.createElement(

        );


      temp.innerHTML =

        temp.querySelectorAll(

        );

      ) {

        hideSection(

        );

        return;

      }


      questions.forEach(

        ) {


          var questionText =

            question.getAttribute(
              "data-faq-answer"
            ) ||
            "";


          var item =
            document.createElement(
              "div"
            );


          item.className =
            "dk-faq-item";


          item.innerHTML =

            '<button type="button" class="dk-faq-question">' +

            '<span>' +

            escapeHtml(
              questionText
            ) +

            '</span>' +

            '<span class="dk-faq-symbol">+</span>' +

            '</button>' +

            '<div class="dk-faq-answer">' +

            '<div class="dk-faq-answer-inner">' +

            escapeHtml(
              answer
            ) +

            '</div>' +

            '</div>';


          faq.appendChild(
            item
          );


          var button =
            item.querySelector(
              ".dk-faq-question"
            );


          button.addEventListener(
            "click",
            function () {

              item.classList.toggle(
                "open"
              );

            }
          );

        }
      );

    }


    /* =================================================
       ACCORDIONS
    ================================================= */

    function setupAccordions() {


      var buttons =
        document.querySelectorAll(
          "#dk-product .dk-section-button"
        );


      buttons.forEach(
        function (
          button
        ) {


          button.addEventListener(
            "click",
            function () {


              var section =
                button.parentElement;


              section.classList.toggle(
                "open"
              );

            }
          );

        }
      );

    }


    /* =================================================
       CART
    ================================================= */

    function setupCart(
      product
    ) {


      var qty =
        document.getElementById(
          "dk-qty"
        );


      var minus =
        document.getElementById(
          "dk-minus"
        );


      var plus =
        document.getElementById(
          "dk-plus"
        );


      var add =
        document.getElementById(
          "dk-add"
        );


      var mobileAdd =
        document.getElementById(
          "dk-mobile-add"
        );


      minus.addEventListener(
        "click",
        function () {


          var value =
            Number(
              qty.value
            ) || 1;


          if (
            value > 1
          ) {

            qty.value =
              value - 1;

          }

        }
      );


      plus.addEventListener(
        "click",
        function () {


          var value =
            Number(
              qty.value
            ) || 1;


          qty.value =
            value + 1;

        }
      );


      qty.addEventListener(
        "input",
        function () {


          var value =
            Number(
              qty.value
            );


          if (
            !value ||
            value < 1
          ) {

            qty.value =
              1;

          }

        }
      );


      add.addEventListener(
        "click",
        function () {


          addProductToCart(
            product,
            qty.value
          );

        }
      );


      mobileAdd.addEventListener(
        "click",
        function () {


          addProductToCart(
            product,
            qty.value
          );

        }
      );

    }


    /* =================================================
       ADD TO CART
    ================================================= */

    function addProductToCart(
      product,
      quantity
    ) {


      var message =
        document.getElementById(
          "dk-cart-message"
        );


      var qty =
        Number(
          quantity
        ) || 1;


      message.textContent =
        "Adding to cart...";


      var url =
        "/?add-to-cart=" +
        encodeURIComponent(
          product.id
        ) +
        String.fromCharCode(38) + "quantity=" +
        encodeURIComponent(
          qty
        );


      fetch(
        url,
        {
          method:
            "GET",

          credentials:
            "same-origin"
        }
      )


      .then(
        function () {


          message.textContent =
            "Product added to cart.";


          document.dispatchEvent(
            new CustomEvent(
              "wc_fragment_refresh"
            )
          );

        }
      )


      .catch(
        function () {


          window.location.href =
            url;

        }
      );

    }


    /* =================================================
       EXTRACT DETAILS
    ================================================= */

    function extractDetails(
      text
    ) {


      var result =
        [];


      var lines =
        text.split(
          /\n+/
        );


      var allowed = [

        "material",

        "color",

        "colour",

        "size",

        "dimensions",

        "dimension",

        "weight",

        "product type",

        "type",

        "style",

        "shape",

        "finish",

        "design",

        "brand",

        "care instructions",

        "care",

        "country of origin",

        "occasion",

        "suitable for",

        "set contains",

        "quantity",

        "number of pieces"

      ];


      lines.forEach(
        function (
          line
        ) {


          var clean =
            line
              .replace(
                /\s+/g,
                " "
              )
              .trim();


          if (
            !clean
          ) {

            return;

          }


          var position =
            clean.indexOf(
              ":"
            );


          if (
            position < 1
          ) {

            return;

          }


          var label =
            clean
              .substring(
                0,
                position
              )
              .trim();


          var value =
            clean
              .substring(
                position + 1
              )
              .trim();


          var valid =
            false;


          allowed.forEach(
            function (
              item
            ) {


              if (
                label
                  .toLowerCase()
                  === item
              ) {

                valid =
                  true;

              }

            }
          );


          if (valid) {
            if (value) {


              result.push(
                {
                  label:
                    label,

                  value:
                    value
                }
              );

            }
          }

        }
      );


      return result;

    }


    /* =================================================
       PLAIN TEXT
    ================================================= */

    function getPlainText(
      html
    ) {


      if (
        !html
      ) {

        return "";

      }


      var temp =
        document.createElement(
          "div"
        );


      temp.innerHTML =
        html;


      return (
        temp.textContent ||
        ""
      );

    }


    /* =================================================
       FORMAT TEXT
    ================================================= */

    function formatText(
      text
    ) {


      if (
        !text
      ) {

        return "";

      }


      return (
        text
          .charAt(0)
          .toUpperCase() +
        text.slice(1)
      );

    }


    /* =================================================
       ESCAPE HTML
    ================================================= */

    function escapeHtml(
      value
    ) {


      var div =
        document.createElement(
          "div"
        );


      div.textContent =
        value;


      return div.innerHTML;

    }


    /* =================================================
       HIDE SECTION
    ================================================= */

    function hideSection(
      id
    ) {


      var element =
        document.getElementById(
          id
        );


      if (
        element
      ) {

        element.style.display =
          "none";

      }

    }


  }
);

</script>
